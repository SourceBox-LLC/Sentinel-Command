name: Agent

# The Sentinel AI agent (agent/) is a SEPARATE Fly deployment from
# Command Center — app `sourcebox-sentinel`, its own dependency set, its
# own lockfile. It shares this repo so the two move under one review and
# one CI, not so they ship together.
#
# `paths` is the other half of the split: this runs only for agent
# changes, and .github/workflows/deploy.yml carries the matching
# paths-ignore so a Command Center change doesn't redeploy the agent.
# See the CAUTION about required status checks in that file before
# adding any.
#
# Required secret:
#   FLY_API_TOKEN_AGENT — a deploy token scoped to `sourcebox-sentinel`.
#     Deliberately NOT the repo's FLY_API_TOKEN, which belongs to
#     Command Center: a token that can deploy both services is a strictly
#     larger blast radius than two that each deploy one.
#     Generate with: flyctl tokens create deploy -a sourcebox-sentinel

on:
  push:
    branches:
      - master
    paths:
      - 'agent/**'
      - '.github/workflows/agent.yml'
  # Validate agent PRs (incl. Dependabot bumps against agent/) before
  # merge. The deploy job is push-only, so a PR checks but never ships.
  pull_request:
    branches:
      - master
    paths:
      - 'agent/**'
      - '.github/workflows/agent.yml'
  workflow_dispatch:  # manual re-deploy from the Actions UI

defaults:
  run:
    working-directory: agent

jobs:
  sanity:
    name: Agent checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Plain `python -m compileall` over app/ catches syntax errors
      # without needing the runtime env (no OLLAMA_API_KEY or other
      # required env vars to satisfy Pydantic Settings). It won't catch
      # import-time errors (missing deps), but the Docker build in the
      # deploy step will — and that's a more accurate gate anyway, since
      # it runs the actual prod environment.
      - name: Compile-check every Python file
        run: python -m compileall -q app

      # Dependency advisories, audited against the LOCKFILE rather than
      # the version ranges — the lockfile is what actually ships, and a
      # range can look clean while the resolved version is vulnerable.
      #
      # This is a hard gate because of what it exists to prevent: this
      # code had no lockfile until 2026-09-08, so every build resolved
      # fresh from PyPI. That caused two boot crashes in one day (mcp 2.x
      # renaming a symbol, Starlette removing on_startup) and a third
      # problem this check catches directly — the `<1` ceiling added to
      # stop the second crash silently held the service on a Starlette
      # line carrying 7 advisories.
      - name: Security advisories (pip-audit)
        run: |
          python -m pip install --quiet pip-audit uv
          uv export --frozen --no-dev --no-hashes -o /tmp/locked.txt
          pip-audit -r /tmp/locked.txt --strict

      # `uv sync --frozen` fails if uv.lock has drifted from
      # pyproject.toml. Without this, a dependency edit that forgets to
      # relock passes CI here and then fails inside the Docker build.
      - name: Lockfile is in sync with pyproject.toml
        run: uv sync --frozen --no-dev

  deploy:
    name: Deploy agent to Fly.io
    runs-on: ubuntu-latest
    needs: sanity
    if: github.event_name != 'pull_request'
    # Serialize agent deploys so two pushes in quick succession don't
    # race on Fly's machine update. Scoped to this app so it never
    # queues behind a Command Center deploy.
    concurrency:
      group: deploy-agent
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Build context is agent/ (via defaults.run.working-directory), so
      # agent/fly.toml and agent/Dockerfile are picked up automatically
      # and agent/.dockerignore applies.
      #
      # `--remote-only` builds on Fly's builder and updates the single
      # machine in place. The agent has no persistent volume, so the
      # simple path works — unlike Command Center, which has to split
      # build-and-push from machine-update because of the
      # opensentry_data volume's single-attachment constraint.
      - name: flyctl deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_AGENT }}
