name: Dependabot auto-merge

# Auto-merge Dependabot PRs for PATCH and MINOR updates once the
# "Test & Deploy" PR checks pass. MAJOR version bumps are left for a
# human to review and merge (they're where breaking changes live).
#
# THE PATCH/MINOR PATH HAD NEVER ONCE SUCCEEDED before 2026-09-11.
# Every single run that reached it failed, six for six:
#
#   resend 2.43.0, @types/react-dom 19.2.5, ruff 0.16.4,
#   user-event 14.6.4, @types/react 19.2.18, deps/weekly-refresh
#
# all with the same error from `gh pr merge --auto`:
#
#   GraphQL: Pull request is in unstable status
#   (enablePullRequestAutoMerge)
#
# WHY: GitHub only lets you *queue* auto-merge on a PR that is actually
# blocked from merging. `mergeStateStatus` of `blocked` or `behind` is
# queueable; `clean` (nothing left to wait for) and `unstable` (a
# non-required check is failing or pending) are both rejected, because
# in those states there is nothing for the queue to wait on.
#
# Until 2026-09-11 `master` had NO required status checks
# (`required_status_checks: contexts: []`), so a Dependabot PR whose
# tests were still running was `unstable`, never `blocked` — the one
# state this workflow cannot handle. Nothing was gating the merge and
# nothing could queue it either. It failed every week in silence.
#
# Now that "Backend tests (sqlite)", "Backend tests (postgres)" and
# "Frontend audit + build" ARE required, a PR with pending tests is
# `blocked` and `--auto` works as intended. The `||` fallback below
# covers the remaining two states: when the PR is already `clean` or
# `unstable` there is nothing to wait for, so merge it now. That
# fallback does not bypass anything — branch protection still refuses a
# merge whose required checks have not passed, which is exactly the
# gate we want enforcing this rather than a reimplementation of it.
#
# STILL OPEN — an auto-merged PR does not deploy.
#   GitHub does not trigger `on: push` workflows for pushes made with
#   GITHUB_TOKEN. So when this workflow merges a PR, master moves but
#   Test & Deploy never runs, and the bump sits undeployed until some
#   human pushes on top of it. Observed directly: four frontend bumps
#   (#268, #270, #271, #272) merged at 10:02-10:04 and produced zero
#   push-event runs. (CodeQL still ran — it is GitHub "default setup",
#   event type `dynamic`, which bypasses this rule. Don't let CodeQL's
#   green checkmark convince you a deploy happened.)
#   Real fix: merge with a PAT instead of GITHUB_TOKEN. Interim:
#   deploy.yml now has a `workflow_dispatch` trigger.
#
# NOT A BUG, in case you go looking: on a non-Dependabot PR the
# `auto-merge` job is skipped and the whole run concludes `skipped`,
# which reports as a neutral check, not a red one. Verified on #289 and
# #291. A guard job to "fix" that red check is not needed because there
# is no red check.
#
# REQUIRES two repo settings (GitHub Actions cannot set these):
#   1. Settings → General → Pull Requests → enable "Allow auto-merge".
#   2. Settings → Actions → General → enable "Allow GitHub Actions to
#      create and approve pull requests" (needed for the approve step).
#
# This is GitHub's documented pattern: dependabot/fetch-metadata to read
# the semver update type, then `gh pr merge --auto`.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only act on Dependabot's own PRs.
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # Patch + minor: approve, then queue auto-merge so GitHub merges
      # once the required status checks pass.
      - name: Approve + enable auto-merge (patch & minor)
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr review --approve "$PR_URL"

          # `--auto` is rejected unless the PR is blocked/behind (see the
          # header comment). If it is already clean or unstable there is
          # nothing to wait for, so merge directly — branch protection
          # still enforces the required checks.
          if ! gh pr merge --auto --squash "$PR_URL"; then
            echo "::notice::Could not queue auto-merge (PR not in a waiting state) — merging directly."
            gh pr merge --squash "$PR_URL"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Major: do NOT auto-merge. Leave a note so it's clear why it's
      # waiting and that a human needs to take it.
      - name: Flag major updates for manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "🛑 **Major version bump** (\`${{ steps.meta.outputs.dependency-names }}\`: ${{ steps.meta.outputs.previous-version }} → ${{ steps.meta.outputs.new-version }}). Auto-merge is intentionally disabled for major updates — please review the changelog and merge manually."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
