name: Dependabot auto-merge

# Auto-merge Dependabot PRs for PATCH and MINOR updates once the
# "Test & Deploy" PR checks pass. MAJOR version bumps are left for a
# human to review and merge (they're where breaking changes live).
#
# TWO KNOWN GAPS — both verified on 2026-09-09, both still open. Read
# these before trusting this workflow to keep production current.
#
# GAP 1: nothing actually gates the merge on CI.
#   `master` has NO required status checks (`required_status_checks:
#   contexts: []`), so `gh pr merge --auto` does not wait for anything —
#   a patch/minor PR merges as soon as this workflow approves it, while
#   its tests are still running.
#   The obvious fix (require "Backend tests" / "Frontend audit + build")
#   is NOT safe as-is: deploy.yml and agent.yml are path-filtered, and a
#   path-skipped workflow reports no status at all, so a required check
#   would hang every PR that misses its paths. Doing this properly needs
#   an always-runs gate job that reports those check names.
#
# GAP 2: an auto-merged PR does not deploy.
#   GitHub does not trigger `on: push` workflows for pushes made with
#   GITHUB_TOKEN. So when this workflow merges a PR, master moves but
#   Test & Deploy never runs, and the bump sits undeployed until some
#   human pushes on top of it. Observed directly: four frontend bumps
#   (#268, #270, #271, #272) merged at 10:02-10:04 and produced zero
#   push-event runs. (CodeQL still ran — it is GitHub "default setup",
#   event type `dynamic`, which bypasses this rule. Don't let CodeQL's
#   green checkmark convince you a deploy happened.)
#   Real fix: merge with a PAT instead of GITHUB_TOKEN. Interim:
#   deploy.yml now has a `workflow_dispatch` trigger.
#
# REQUIRES two repo settings (GitHub Actions cannot set these):
#   1. Settings → General → Pull Requests → enable "Allow auto-merge".
#   2. Settings → Actions → General → enable "Allow GitHub Actions to
#      create and approve pull requests" (needed for the approve step).
#
# This is GitHub's documented pattern: dependabot/fetch-metadata to read
# the semver update type, then `gh pr merge --auto`.

#
# WHY THE GUARD JOB EXISTS: `on: pull_request` fires for EVERY pull request
# in this repo, not just Dependabot's. When `github.actor` is anything else
# the auto-merge job is skipped — and a run where ALL jobs are skipped
# concludes **`failure`**, not `skipped`, on pull_request events. So every
# human PR painted a red `auto-merge` check that meant nothing.
#
# Observed directly on the resend bump (#247): `auto-merge fail 8s` while
# Backend tests (sqlite), Backend tests (postgres) and Frontend audit +
# build were all green. A red check that is always wrong is worse than no
# check — it trains you to ignore the column.
#
# The guard below runs and succeeds for non-Dependabot PRs, so the run goes
# green instead of red.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  # Succeed immediately for non-Dependabot PRs so the run isn't a false red.
  skip-non-dependabot:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - run: echo "Not a Dependabot PR — nothing to auto-merge."

  auto-merge:
    runs-on: ubuntu-latest
    # Only act on Dependabot's own PRs.
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # Patch + minor: approve and enable auto-merge. GitHub then merges
      # automatically once required status checks (see setting #2) pass.
      - name: Approve + enable auto-merge (patch & minor)
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Major: do NOT auto-merge. Leave a note so it's clear why it's
      # waiting and that a human needs to take it.
      - name: Flag major updates for manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "🛑 **Major version bump** (\`${{ steps.meta.outputs.dependency-names }}\`: ${{ steps.meta.outputs.previous-version }} → ${{ steps.meta.outputs.new-version }}). Auto-merge is intentionally disabled for major updates — please review the changelog and merge manually."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
